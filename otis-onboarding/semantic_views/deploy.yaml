version: v1alpha
type: vulcan
name: service-analytics-core
tags:
  - snowflake-analytics
  - service-analytics
  - semantic-core
spec:
  runAsUser: "deepakjaiswaltmdcio"
  compute: otis-compute
  engine: snowflake
  repo:
    url: https://github.com/itsyourdj/Onboarding
    syncFlags:
      - "--ref=main"
      - "--submodules=off"
    baseDir: Onboarding/otis-onboarding/semantic_views
    secretId: otis-onboarding:onboarding-repo-access
  depots:
    - dataos://analyticsprod?purpose=rw
  workflow:
    type: schedule
    schedule:
      crons:
        - "0 11 * * *"
      timezone: "Asia/Kolkata"
      endOn: "2027-01-01T00:00:00Z"
      concurrencyPolicy: Forbid
    logLevel: INFO
    resource:
      request:
        cpu: "500m"
        memory: "512Mi"
      limit:
        cpu: "1000m"
        memory: "1Gi"

    plan:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - plan
        - --auto-apply
    run:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - run
  api:
    replicas: 1
    logLevel: INFO
    resource:
      request:
        cpu: "500m"
        memory: "512Mi"
      limit:
        cpu: "1000m"
        memory: "1Gi"