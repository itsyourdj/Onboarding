kind: semantic
name: CALLBACKS
depends_on: SSD_NAA_PROD.RL_AMERICA.FLAT_CALLBACK_EVENT
description: "Reactive service visits triggered when a unit faults or is reported not working (as opposed to planned preventive maintenance)."
measures:
  - name: ENTRAPMENT_CALLBACKS
    type: sum
    expression: CASE WHEN {CALLBACKS.TRAPPED_PASSENGER_FLAG} = 'Y' THEN 1 ELSE 0 END
    description: "Callbacks involving a trapped passenger"
    ai_context:
      instructions: Use for safety-critical callback volume tracking.
      caveats:
        - Sums a boolean flag and counts callback rows, not unique units.
      synonyms:
        - entrapments
        - trapped passenger calls
  - name: FIRST_TIME_FIX_RATE_PCT
    type: number
    expression: ROUND(SUM(CASE WHEN {CALLBACKS.FTFR_FLAG} = 'Y' THEN 1 ELSE 0 END) * 100.0 / NULLIF(SUM(CASE WHEN {CALLBACKS.FTFR_FLAG} IN ('Y', 'N') THEN 1 ELSE 0 END), 0), 1)
    description: "Percent of callbacks fixed on first visit"
    ai_context:
      instructions: KPI for service effectiveness on reactive visits.
      caveats:
        - Excludes records where FTFR flag is missing.
        - Percentage can be distorted in low-volume slices.
      synonyms:
        - FTFR
        - first time fix
  - name: OUT_OF_SERVICE_CALLBACKS
    type: sum
    expression: CASE WHEN {CALLBACKS.OUT_OF_SERVICE_FLAG} = 'Y' THEN 1 ELSE 0 END
    description: "Callbacks where the unit was out of service"
    ai_context:
      instructions: Use to monitor high-impact downtime callbacks.
      caveats:
        - Flag-based count; not duration of outage.
      synonyms:
        - outage callbacks
        - downtime callbacks
  - name: TOTAL_CALLBACKS
    type: count
    expression: '{CALLBACKS.CALLBACKID}'
    description: "Count of callback events"
    ai_context:
      instructions: Primary workload measure for reactive service demand.
      synonyms:
        - callback volume
        - service call count
  - name: AVG_CALLBACK_LEAD_TIME_HOURS
    type: avg
    expression: DATEDIFF('hour', {CALLBACKS.NAA_DISPATCHED_DATE}, {CALLBACKS.ARRIVED_SITE})
    description: "Average hours between technician dispatch and on-site arrival (added 2026-07-29, parity with service_sla_analytics_mcp's response-time measure)."
    ai_context:
      instructions: Real SLA response-time measure. Use for response-time trending and technician dispatch efficiency.
      caveats:
        - NULL when dispatch or arrival timestamp is missing.
      synonyms:
        - response time
        - average response time
        - dispatch lead time
  - name: TOTAL_UNIT_DOWNTIME_HOURS
    type: sum
    expression: CASE WHEN {CALLBACKS.OUT_OF_SERVICE_FLAG} = 'Y' THEN DATEDIFF('hour', {CALLBACKS.NAA_DISPATCHED_DATE}, {CALLBACKS.LEFT_SITE_BISDATE}) ELSE 0 END
    description: "Total hours units were left out of service across callbacks (added 2026-07-29), from dispatch until the technician left site."
    ai_context:
      instructions: Use to quantify cumulative equipment downtime impact from out-of-service callbacks.
      caveats:
        - Only accrues hours for callbacks flagged OUT_OF_SERVICE_FLAG='Y'; zero otherwise.
        - NULL dispatch/left timestamps are treated as no downtime contribution.
      synonyms:
        - downtime hours
        - outage duration
        - unit downtime
dimensions:
- name: CALLBACKID
  description: "Unique callback event identifier."
  behavior:
    type: identifier
  ai_context:
    instructions: Use as the event-level key for callback records.
    synonyms:
      - callback id
      - service call id
- name: CALLBACK_DATE
  description: "Calendar date of the callback."
  ai_context:
    instructions: Use for daily, weekly, and monthly callback trends.
    synonyms:
      - callback day
      - event date
- name: CALLBACK_TYPE
  description: "Callback category/type."
- name: CONTRACT_ID
  description: "Contract associated with the callback."
  ai_context:
    instructions: Use to tie callbacks to contract performance.
    synonyms:
      - contract
      - agreement id
- name: CUSTOMER_ID
  description: "Customer associated with the callback."
  ai_context:
    instructions: Use for customer-level reliability analysis.
    synonyms:
      - customer
      - account
- name: FTFR_FLAG
  description: "First-time-fix-resolved flag (Y/N)."
  ai_context:
    instructions: Use as the success flag for first-visit resolution.
    synonyms:
      - first fix flag
      - fixed first visit
- name: GBO
  description: "Global business organization / branch grouping."
- name: OUT_OF_SERVICE_FLAG
  description: "Unit-out-of-service flag (Y/N)."
  ai_context:
    instructions: Indicates callback impact on unit availability.
    synonyms:
      - outage flag
      - out of service indicator
- name: PRODUCTCLASS
  description: "Product class of the unit at time of callback."
  ai_context:
    instructions: Use to compare callback patterns across equipment classes.
    synonyms:
      - product class
      - equipment type
- name: TCB_FLAG
  description: "Trouble-callback flag (Y/N)."
- name: TRAPPED_PASSENGER_FLAG
  description: "Entrapment / trapped-passenger flag (Y/N)."
  ai_context:
    instructions: Use to isolate passenger-entrapment safety events.
    synonyms:
      - entrapment flag
      - trapped passenger indicator
- name: UNIT_ID
  description: "Unit that generated the callback (FK to UNITS)."
  ai_context:
    instructions: Use for unit-level reliability and repeat-callback analysis.
    synonyms:
      - unit
      - equipment id
- name: CALLBACK_DATE_TIME
  description: "Timestamp the callback was logged."
  ai_context:
    instructions: Use for intraday and response-time sequence analysis.
    synonyms:
      - callback timestamp
      - logged time
- name: NAA_DISPATCHED_DATE
  description: "Timestamp a technician was dispatched for this callback (added 2026-07-29) — start of the SLA response-time clock."
  ai_context:
    instructions: Use as the start point for response-time and resolution-time calculations.
    synonyms:
      - dispatch time
      - dispatched at
- name: ARRIVED_SITE
  description: "Timestamp the technician arrived on site (added 2026-07-29) — end of the SLA response-time clock."
  ai_context:
    instructions: Use as the end point for response-time calculations.
    synonyms:
      - arrival time
      - arrived at
- name: LEFT_SITE_BISDATE
  description: "Timestamp the technician left the site (added 2026-07-29)."
  ai_context:
    instructions: Use with NAA_DISPATCHED_DATE to compute unit downtime duration for out-of-service callbacks.
    synonyms:
      - left site time
- name: CLOSED_ON
  description: "Timestamp the callback was closed out (added 2026-07-29) — end of the SLA resolution-time clock."
  ai_context:
    instructions: Use as the end point for resolution-time calculations.
    synonyms:
      - closed at
      - resolution time end
