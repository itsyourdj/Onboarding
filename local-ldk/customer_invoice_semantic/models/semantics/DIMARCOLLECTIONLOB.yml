# Source: design spec > Section 13 Model Architecture
# Semantic wrapper for the LOB Reference Dimension (EXTERNAL — owned by JDE pipeline).
# Maps GL Offset codes to Line of Business labels.
kind: semantic
name: DimARCollectionLOB
depends_on: JDE_PRODUCTION.RL_JDE.DIMARCOLLECTIONLOB
description: >
  Line of Business Reference Dimension — maps GL Offset codes to LOB labels.
  One row per LOBKey (company + LOB code). Used to classify invoices and
  collection records by business line across all fact tables.

tags:
  - accounts-receivable
  - reference
  - lob

ai_context:
  instructions: >
    Use this model to look up the full description of a Line of Business code (LOBDescription).
    Join from FactARCollection or DimARDetails on LOBCode / LOB column.
  synonyms:
    - "LOB reference"
    - "line of business reference"
    - "LOB lookup"
  examples:
    - description: "List all Lines of Business"
      format: sql
      query: |
        SELECT LOBCode, LOBDescription, GLOffset
        FROM JDE_PRODUCTION.RL_JDE.DIMARCOLLECTIONLOB
        ORDER BY LOBDescription

dimensions:
  - name: LOBKey
    behavior:
      type: identifier
  - name: CompanyId
    behavior:
      type: identifier
  - name: LOBCode
    behavior:
      type: categorical
    ai_context:
      synonyms:
        - "LOB"
        - "LOB code"
        - "line of business code"
  - name: LOBDescription
    behavior:
      type: categorical
    ai_context:
      synonyms:
        - "LOB name"
        - "business line name"
        - "LOB label"
  - name: GLOffset
    behavior:
      type: categorical
    ai_context:
      synonyms:
        - "GL offset"
        - "offset code"
