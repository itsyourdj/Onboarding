# ─────────────────────────────────────────────────────────────────────────────
# GOLD OUTPUT: FACTDSO — built by models/FACTDSO.sql (Vulcan FULL)
# ─────────────────────────────────────────────────────────────────────────────
- name: JDE_PRODUCTION.RL_JDE_VULCAN.FACTDSO
  description: >
    DSO & Dispute Analytics — company × fiscal period × collection-priority grain.
    Calendar-day disputed rolling (DATEADD windows). Built by Vulcan from staging.
  grains:
    - COMPANYID
    - FISCALYEAR
    - FISCALMONTH
    - COLLECTIONPRIORITY
  columns:
    COMPANYID: VARCHAR(10)
    FISCALYEAR: INTEGER
    FISCALMONTH: INTEGER
    COLLECTIONPRIORITY: VARCHAR(10)
    TOTALOPENAR: DECIMAL(18, 2)
    TOTALGROSSINVOICED: DECIMAL(18, 2)
    DAYSINPERIOD: INTEGER
    DSO: DECIMAL(18, 4)
    AVGCONTRACTUALNETDAYS: DECIMAL(18, 4)
    DSOVARIANCEFROMTERMS: DECIMAL(18, 4)
    DISPUTEDAMOUNTTOTAL: DECIMAL(18, 2)
    DISPUTEDAMOUNTROLLING30: DECIMAL(18, 2)
    DISPUTEDAMOUNTROLLING60: DECIMAL(18, 2)
    DISPUTEDAMOUNTROLLING90: DECIMAL(18, 2)
    DISPUTEDAMOUNTROLLING180: DECIMAL(18, 2)
    RESOLVEDDISPUTEGROSS: DECIMAL(18, 2)
    RESOLVEDDISPUTERECOVERED: DECIMAL(18, 2)
    DISPUTERECOVERYRATIO: DECIMAL(10, 6)
    CEI: DECIMAL(10, 6)
    INVOICECOUNT: INTEGER
    DISPUTEDINVOICECOUNT: INTEGER
    INSERTDATE: TIMESTAMP_NTZ
  column_descriptions:
    COMPANYID: JDE company identifier; part of FactDSO grain key.
    FISCALYEAR: Fiscal year from invoice GL date; part of FactDSO grain key.
    FISCALMONTH: Fiscal month (1-12); part of grain key and trend time axis.
    COLLECTIONPRIORITY: Collection priority segment (H/M/L/NONE from F03012).
    TOTALOPENAR: Sum of open amounts for invoices in this segment and period.
    TOTALGROSSINVOICED: Sum of gross invoiced amounts in period (DSO denominator).
    DAYSINPERIOD: Calendar days in the fiscal month.
    DSO: Days Sales Outstanding = (TotalOpenAR / TotalGrossInvoiced) * DaysInPeriod.
    AVGCONTRACTUALNETDAYS: Average contractual net days from F0014 payment terms.
    DSOVARIANCEFROMTERMS: DSO minus avg contractual net days; positive = slower than terms.
    DISPUTEDAMOUNTTOTAL: Total disputed amount for disputes in this period.
    DISPUTEDAMOUNTROLLING30: Sum disputed where COALESCE(DisputeDate, GLDate) >= CURRENT_DATE - 30 days.
    DISPUTEDAMOUNTROLLING60: Sum disputed where dispute date anchor >= CURRENT_DATE - 60 days.
    DISPUTEDAMOUNTROLLING90: Sum disputed where dispute date anchor >= CURRENT_DATE - 90 days.
    DISPUTEDAMOUNTROLLING180: Sum disputed where dispute date anchor >= CURRENT_DATE - 180 days.
    RESOLVEDDISPUTEGROSS: Total gross amount of resolved disputed invoices.
    RESOLVEDDISPUTERECOVERED: Amount recovered on resolved disputes.
    DISPUTERECOVERYRATIO: Proportion recovered = Recovered / Gross for resolved disputes.
    CEI: Unified collection effectiveness index for this priority segment.
    INVOICECOUNT: Number of invoices in this segment and period.
    DISPUTEDINVOICECOUNT: Number of disputed invoices in this segment and period.
    INSERTDATE: Vulcan load timestamp for the FactDSO snapshot.
  column_tags:
    COMPANYID: ['GRAIN', 'JOIN_KEY']
    COLLECTIONPRIORITY: ['GRAIN', 'PRIORITY']
    DSO: ['MEASURE', 'KPI']
    CEI: ['MEASURE', 'KPI']
