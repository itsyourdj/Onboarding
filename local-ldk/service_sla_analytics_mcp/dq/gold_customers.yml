# Source: build follow-up (2026-07-29) — customers bridge/dimension model
kind: dq
name: gold_customers_dq
depends_on: analytics.gold_customers

# Profiled columns: grain key (PK) only. No numeric, time, or boolean columns
# exist on this dimension model.
profiles:
  - CUSTOMER_ID

rules:
  - missing_count(CUSTOMER_ID) = 0:
      name: customer_id_required
      dimension: completeness

  - duplicate_count(CUSTOMER_ID) = 0:
      name: unique_customer_ids
      dimension: uniqueness
