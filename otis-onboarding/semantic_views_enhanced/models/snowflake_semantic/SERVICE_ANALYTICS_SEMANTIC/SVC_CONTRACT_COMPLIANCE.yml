kind: semantic
name: SVC_CONTRACT_COMPLIANCE
depends_on: NAABO_PROD.REPORTING.SVC_COMPLIANCE
description: "Trailing-12-month contract visit compliance."
measures:
  - name: LATEST_ACTUAL_VISIT
    type: max
    expression: '{SVC_CONTRACT_COMPLIANCE.ACTUALVISITS12MONTHS}'
    description: "Most recent actual maintenance visit (12m)"
    ai_context:
      instructions: Use to identify recency of latest maintenance execution.
      caveats:
        - Returns a latest timestamp-like value, not a count of visits.
      synonyms:
        - last actual visit
        - recent maintenance visit
  - name: TOTAL_EXPECTED_VISITS
    type: sum
    expression: '{SVC_CONTRACT_COMPLIANCE.VISITS12MONTHS}'
    description: "Sum of expected visits (12m)"
    ai_context:
      instructions: Use as planned maintenance obligation over trailing 12 months.
      caveats:
        - Planned volume may differ by contract terms and unit mix.
      synonyms:
        - required visits
        - planned visits
dimensions:
  - name: CONTRACT_ID
    description: "Contract governing the required visits."
    ai_context:
      instructions: Use to evaluate compliance by service agreement.
      synonyms:
        - contract
        - agreement id
  - name: GBO
    description: "Global business organization / branch grouping."
  - name: REGION
    description: "Region the unit belongs to."
    ai_context:
      instructions: Use for geographic compliance rollups.
      synonyms:
        - geography
        - area
  - name: UNIT_ID
    description: "Unit the compliance row is for (FK to UNITS)."
    ai_context:
      instructions: Use for unit-level contract compliance tracking.
      synonyms:
        - unit
        - equipment id
  - name: ACTUALVISITS12MONTHS
    description: "Timestamp of the last actual maintenance visit in the trailing 12 months (source column is a timestamp, not a count)."
    ai_context:
      instructions: Use as the source recency field for last visit analysis.
      caveats:
        - Despite the name, this field stores timestamp semantics.
      synonyms:
        - actual visit date
        - last maintenance date
  - name: VISITS12MONTHS
    description: "Contracted/required visits in the trailing 12 months."
    ai_context:
      instructions: Use as required visit baseline for compliance KPIs.
      synonyms:
        - required annual visits
        - planned maintenance count
