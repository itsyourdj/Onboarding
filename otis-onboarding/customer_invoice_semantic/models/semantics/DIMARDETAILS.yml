# Source: design spec > Section 13 Model Architecture + Section 15.5 AI Context
# Semantic wrapper for the Invoice Dimension table (EXTERNAL — owned by JDE pipeline).
# One row per invoice / pay-item. Attributes only — no financial amounts.
kind: semantic
name: DIMARDETAILS
depends_on: JDE_PRODUCTION.RL_JDE.DIMARDETAILS
description: >
  Invoice Dimension — the descriptive backbone of Customer Invoices Analysis.
  One row per invoice / pay-item (grain: COMPANYID + DOCUMENTCOMPANY + DOCNO + DOCTYPE + PAYITM).
  Use this model when questions involve: who owns an invoice (COLLECTOR, SALESREP),
  what status it is in (DISPUTESTATUS, HOLDFLAG), which LOB it belongs to,
  or what the latest collection comment says.
  For financial amounts and aging, JOIN to FACTARDETAILS on the same grain key.

tags:
  - accounts-receivable
  - invoice
  - dimension
  - collections
terms:
  - finance.accounts_receivable

ai_context:
  instructions:
    - >
      Use this model when the question involves describing an invoice — who owns it,
      what status it is in, whether it is disputed, whether the customer is on credit hold,
      which LOB it belongs to, or what the latest collection comment says.
    - >
      One row = one invoice / pay-item. Group by COLLECTOR for performance attribution;
      group by LOB for line-of-business analysis. For financial amounts, JOIN to FACTARDETAILS.
  synonyms:
    - "invoice dimension"
    - "AR dimension"
    - "invoice attributes"
    - "invoice details"
    - "invoice master"
  examples:
    - description: "Which customers have overdue invoices with no dispute on record?"
      format: sql
      query: |
        SELECT d.CUSTOMERNUMBER, d.COLLECTOR, COUNT(*) AS overdue_count
        FROM JDE_PRODUCTION.RL_JDE.DIMARDETAILS d
        JOIN JDE_PRODUCTION.RL_JDE.FACTARDETAILS f
          ON d.COMPANYID = f.COMPANYID AND d.DOCNO = f.DOCNO
          AND d.DOCTYPE = f.DOCTYPE AND d.PAYITM = f.PAYITM
        WHERE f.AGINGDAYS > 30 AND d.DISPUTESTATUS IS NULL
        GROUP BY d.CUSTOMERNUMBER, d.COLLECTOR
        ORDER BY overdue_count DESC
    - description: "Show open disputes by LOB and resolver"
      format: sql
      query: |
        SELECT d.LOB, d.RESOLVERNAME, COUNT(*) AS open_dispute_count,
               SUM(f.OPENAMOUNT) AS total_disputed_amount
        FROM JDE_PRODUCTION.RL_JDE.DIMARDETAILS d
        JOIN JDE_PRODUCTION.RL_JDE.FACTARDETAILS f
          ON d.COMPANYID = f.COMPANYID AND d.DOCNO = f.DOCNO
          AND d.DOCTYPE = f.DOCTYPE AND d.PAYITM = f.PAYITM
        WHERE d.DISPUTESTATUS = 'Open'
        GROUP BY d.LOB, d.RESOLVERNAME
        ORDER BY total_disputed_amount DESC

dimensions:
  # ── Grain / Identity ────────────────────────────────────────────────────────
  - name: COMPANYID
    behavior:
      type: identifier
  - name: DOCUMENTCOMPANY
    behavior:
      type: identifier
  - name: DOCNO
    behavior:
      type: identifier
  - name: DOCTYPE
    behavior:
      type: identifier
  - name: PAYITM
    behavior:
      type: identifier
  # ── Customer & Ownership ────────────────────────────────────────────────────
  - name: CUSTOMERNUMBER
    behavior:
      type: identifier
    ai_context:
      synonyms:
        - "customer"
        - "customer ID"
        - "account number"
        - "customer no"
  - name: PARENTCUSTOMER
    behavior:
      type: identifier
    ai_context:
      synonyms:
        - "parent account"
        - "parent customer"
        - "ultimate parent"
  - name: SALESREP
    behavior:
      type: categorical
    ai_context:
      synonyms:
        - "sales representative"
        - "sales person"
  - name: COLLECTOR
    behavior:
      type: categorical
    ai_context:
      synonyms:
        - "collections rep"
        - "AR collector"
        - "collections person"
      caveats:
        - "COLLECTOR is the individual responsible for chasing payment; COLLECTIONMANAGER is their manager — do not confuse the two when grouping for performance reports"
  - name: COLLECTIONMANAGER
    behavior:
      type: categorical
  # ── LOB & Business Unit ──────────────────────────────────────────────────────
  - name: GLOFFSET
    behavior:
      type: categorical
  - name: LOB
    behavior:
      type: categorical
    ai_context:
      synonyms:
        - "line of business"
        - "business line"
        - "division"
        - "segment"
      caveats:
        - "LOB is derived from GLOFFSET via DIMARCOLLECTIONLOB. A null LOB means the GL Offset was unrecognised — exclude null LOB rows from LOB-level CEI reports"
  - name: BUSINESSUNIT
    behavior:
      type: categorical
  - name: BUDESC
    behavior:
      type: categorical
  # ── Payment Terms ────────────────────────────────────────────────────────────
  - name: PAYMENTTERMCODE
    behavior:
      type: categorical
    ai_context:
      synonyms:
        - "payment terms"
        - "payment condition"
  # ── Dispute Fields ───────────────────────────────────────────────────────────
  - name: DISPUTEREASONCODE
    behavior:
      type: categorical
  - name: DISPUTESTATUS
    behavior:
      type: categorical
    ai_context:
      synonyms:
        - "dispute"
        - "dispute flag"
        - "dispute state"
      caveats:
        - "Null DISPUTESTATUS means the invoice has NO registered dispute — treat null as 'not disputed', not as unknown"
  - name: DISPUTECODEDESC
    behavior:
      type: categorical
  - name: RESOLVERCODE
    behavior:
      type: categorical
  - name: RESOLVERNAME
    behavior:
      type: categorical
  # ── Dates ─────────────────────────────────────────────────────────────────────
  - name: INVOICEDATE
  - name: DUEDATE
    ai_context:
      synonyms:
        - "payment due"
        - "due date"
        - "payment deadline"
      caveats:
        - "DUEDATE is the contractual payment deadline; PROMISETOPAY is the customer-committed date — they differ for disputed or negotiated invoices"
  - name: PROMISETOPAY
    ai_context:
      synonyms:
        - "promise to pay"
        - "PTP date"
        - "committed payment date"
  - name: ATTACHMENTSTARTDATE
  - name: ATTACHMENTENDDATE
  # ── Customer Status ──────────────────────────────────────────────────────────
  - name: CURRENCYCODE
    behavior:
      type: categorical
  - name: HOLDFLAG
    behavior:
      type: categorical
    ai_context:
      synonyms:
        - "credit hold"
        - "hold flag"
        - "on hold"
      caveats:
        - "Y = on credit hold, N = not on hold, null = unknown. Filter HOLDFLAG = 'Y' to identify credit hold exposure (leakage signal L8)"
  - name: WORKDAYEMAIL
    ai_context:
      synonyms:
        - "collector email"
        - "work email"
  - name: CHARGEBACKCODE
    behavior:
      type: categorical
  # ── Comments ──────────────────────────────────────────────────────────────────
  - name: LASTINVOICECOMMENT
  - name: LASTCUSTOMERCOMMENT
  # ── Audit ─────────────────────────────────────────────────────────────────────
  - name: INSERTDATE
  - name: MODIFYDATE

measures:
  # ── Count measures ──────────────────────────────────────────────────────────
  - name: INVOICE_COUNT
    type: count
    description: Total number of invoices / pay-item records
    behavior:
      type: flow
    ai_context:
      synonyms:
        - "invoice count"
        - "number of invoices"
        - "invoice volume"
      examples:
        - description: "How many invoices by LOB?"
          format: sql
          query: |
            SELECT MEASURE(DIMARDETAILS.INVOICE_COUNT), LOB
            FROM DIMARDETAILS
            GROUP BY LOB

  - name: RESOLVED_DISPUTE_COUNT
    type: count
    filters:
      - "{DIMARDETAILS.DISPUTESTATUS} = 'Resolved'"
    description: Count of invoices where DISPUTESTATUS = Resolved
    behavior:
      type: flow
    ai_context:
      synonyms:
        - "resolved disputes"
        - "closed disputes"
      caveats:
        - "Numerator of DISPUTE_RESOLUTION_RATE — query this and TOTAL_DISPUTE_COUNT separately to compute the rate at the correct grain"

  - name: TOTAL_DISPUTE_COUNT
    type: count
    filters:
      - "{DIMARDETAILS.DISPUTESTATUS} IS NOT NULL"
    description: Count of invoices with any dispute status recorded (open or resolved)
    behavior:
      type: flow
    ai_context:
      synonyms:
        - "all disputes"
        - "disputed invoices"
      caveats:
        - "Denominator of DISPUTE_RESOLUTION_RATE — includes both open and resolved disputes"

  - name: CREDIT_HOLD_INVOICE_COUNT
    type: count
    filters:
      - "{DIMARDETAILS.HOLDFLAG} = 'Y'"
    description: Count of invoices where the customer is on credit hold
    behavior:
      type: flow
    ai_context:
      synonyms:
        - "credit hold count"
        - "hold invoices"

  - name: DISPUTE_RESOLUTION_RATE
    type: number
    expression: >
      SUM(CASE WHEN {DIMARDETAILS.DISPUTESTATUS} = 'Resolved' THEN 1 ELSE 0 END) /
      NULLIF(SUM(CASE WHEN {DIMARDETAILS.DISPUTESTATUS} IS NOT NULL THEN 1 ELSE 0 END), 0)
    description: >
      Fraction of disputes that have been resolved.
      Formula: COUNT(Resolved) / COUNT(any dispute status).
      Target: >= 0.80 (80% resolution rate).
    behavior:
      type: ratio
      numerator: RESOLVED_DISPUTE_COUNT
      denominator: TOTAL_DISPUTE_COUNT
    ai_context:
      synonyms:
        - "dispute resolution rate"
        - "resolution rate"
        - "disputes resolved"
      caveats:
        - "Query RESOLVED_DISPUTE_COUNT and TOTAL_DISPUTE_COUNT separately when a time grain is present; do not average pre-computed ratio values"

segments:
  - name: overdue_no_dispute
    expression: "{DIMARDETAILS.DISPUTESTATUS} IS NULL"
    description: >
      Invoices with no active dispute on record. Combine with AGINGDAYS > 30 in FACTARDETAILS
      for the 'overdue without action' leakage signal (Signal L4).
    ai_context:
      synonyms:
        - "undisputed invoices"
        - "no dispute"
        - "overdue without dispute"
      examples:
        - description: "Show overdue invoices with no dispute by collector"
          format: sql
          query: |
            SELECT MEASURE(DIMARDETAILS.INVOICE_COUNT), DIMARDETAILS.COLLECTOR
            FROM DIMARDETAILS
            WHERE overdue_no_dispute IS TRUE
            GROUP BY DIMARDETAILS.COLLECTOR

  - name: credit_hold_with_balance
    expression: "{DIMARDETAILS.HOLDFLAG} = 'Y'"
    description: >
      Customers on credit hold. Join to FACTARDETAILS.OPENAMOUNT to see outstanding
      exposure (leakage signal L8: credit hold + open AR > 0).
    ai_context:
      synonyms:
        - "credit hold"
        - "on hold customers"
        - "hold flag Y"

joins:
  - name: DIMARCOLLECTIONLOB
    type: many_to_one
    expression: "{DIMARDETAILS.LOB} = {DIMARCOLLECTIONLOB.LOBCODE}"
    ai_context:
      instructions: "Join to DIMARCOLLECTIONLOB to access full LOB description (LOBDESCRIPTION field)."

  - name: ARPAYMENTTERM
    type: many_to_one
    expression: "{DIMARDETAILS.PAYMENTTERMCODE} = {ARPAYMENTTERM.PAYMENTTERMCODE}"
    ai_context:
      instructions: "Join to ARPAYMENTTERM to access NETDAYS for payment term compliance analysis (AGINGDAYS > NETDAYS)."
