# Source: design spec > Section 1 Business Context + stakeholder feedback
# Enhanced DP: builds RL_JDE_VULCAN gold from staging via Vulcan SQL models.

what_it_answers:
  - question: "How long does it take to collect cash? (Days Sales Outstanding)"
    metric: DSO_TREND
    source: FactDSO.DSO
    formula: "(TotalOpenAR / TotalGrossInvoiced) × DaysInPeriod"
    notes: Built by models/FACTDSO.sql — aligned with SP_LOAD_FACTDSO logic.

  - question: "How much disputed amount is accumulating?"
    metrics:
      - DISPUTED_AMOUNT_ROLLING_30_TREND
      - DISPUTED_AMOUNT_ROLLING_60_TREND
      - DISPUTED_AMOUNT_ROLLING_90_TREND
      - DISPUTED_AMOUNT_ROLLING_180_TREND
    source: FactDSO.DisputedAmountRolling30/60/90/180
    formula: "SUM(disputed) WHERE COALESCE(DisputeDate, GLDate) >= CURRENT_DATE - N days"

  - question: "What proportion of resolved disputed invoices is recovered?"
    metric: DISPUTE_RECOVERY_RATIO_TREND
    source: FactDSO.DisputeRecoveryRatio

  - question: "Is collection prioritization working?"
    metric: DSO_BY_COLLECTION_PRIORITY
    source: FactDSO.DSO by CollectionPriority

  - question: "What is our collection effectiveness (CEI)?"
    metric: CEI_TREND
    source: FactDSO.CEI
    notes: Use COLLECTION_EFFICIENCY_TREND for receipt-level cash application detail.

  - question: "Collection leakage, reserve accuracy, overdue volume?"
    metrics:
      - UNAPPLIED_CASH_TREND
      - RESERVE_ACCURACY_TREND
      - OVERDUE_INVOICE_TREND
      - OPEN_AR_TREND

good_for:
  - title: Building and governing the Invoice 360 gold layer from raw JDE staging
    details: >
      Vulcan SQL models materialize 6 gold tables in RL_JDE_VULCAN (includes FactDSO),
      with semantics, metrics, DQ, and audits on top.

  - title: DSO, dispute rolling, recovery, and collection prioritization
    details: Same KPIs as Core semantic product — sourced from Vulcan-built FactDSO.

  - title: Collection leakage, reserve accuracy, and invoice-level AR analysis
    details: FactARDetails, FactARCollection, DimARDetails semantic models.

not_for:
  - Consuming RL_JDE gold only without running transforms — use customer_invoice_semantic (Core)
  - Real-time alerting — daily scheduled refresh
  - Sub-invoice-line detail
  - Multi-currency USD normalisation

caveats:
  - title: Enhanced vs Core product split
    details: >
      Enhanced builds gold from staging (RL_JDE_VULCAN). Core wraps existing RL_JDE gold as EXTERNAL.
      Do not run both products writing the same schema without coordination.
    severity: high

  - title: Two CEI metrics — different grains
    details: CEI_TREND (FactDSO) vs COLLECTION_EFFICIENCY_TREND (FactARCollection).
    severity: low

  - title: Estimated DQ thresholds require calibration post-deployment
    severity: high

