kind: semantic
name: CUSTOMERS
depends_on: MDM_NAA_PROD.MDM_OUTBOUND.GLOBAL_CUSTOMER_MASTER
description: "Golden customer master (one row per customer)."
measures:
- name: CUSTOMER_COUNT
  type: count
  expression: '{CUSTOMERS.CUSTOMER_ID}'
  description: "Number of customers"
joins:
- name: CONTRACTS
  type: one_to_many
  on: CUSTOMER_ID
- name: NPS_SURVEYS
  type: one_to_many
  on: CUSTOMER_ID
dimensions:
- name: BILLING_CURRENCY_CD
  description: "ISO currency code standardized from source variants (US Dollar to USD)."
- name: COUNTRY_CD
  description: "Two-char country code standardized from source variants (United States to US)."
- name: CUSTOMER_CLASSIFICATION
  description: "Customer classification code (upper-cased, trimmed)."
- name: CUSTOMER_ID
  description: "Surrogate customer key (CUST_ + last 6 chars of CUSTOMER_EID)."
  behavior:
    type: identifier
- name: CUSTOMER_NAME
  description: "Customer legal name. PII - handle per data classification."
- name: GBO
  description: "Global business organization / branch grouping."
- name: REGION_DESC
  description: "Sales region description."
- name: SALES_SEGMENT
  description: "Sales segment, standardized to title case."
