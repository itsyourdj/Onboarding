name: customer-invoices-enhanced
version: v1alpha
type: vulcan
tags:
  - accounts-receivable
  - collections
  - finance
  - invoice
  - snowflake
description: >
  Customer Invoices Enhanced — centralised AR data product providing semantic governance,
  business metrics (DSO, DSO vs terms, disputed rolling 30/60/90/180, dispute recovery,
  CEI by priority, open AR, reserve accuracy, unapplied cash, overdue invoices),
  Vulcan-built gold layer (6 tables in RL_JDE_VULCAN), AI-agent-ready context, and quality monitoring over the Invoice 360 star schema.

spec:
  runAsUser: "deepakjaiswaltmdcio"
  compute: otis-compute
  engine: snowflake
  repo:
    url: https://github.com/itsyourdj/Onboarding
    syncFlags:
      - "--ref=main"
      - "--submodules=off"
    baseDir: Onboarding/otis-onboarding/customer_invoice_enhanced
    secretId: otis-onboarding:onboarding-repo-access
  depots:
    - dataos://jdeproduction?purpose=rw
  workflow:
    type: schedule
    schedule:
      crons:
        - "0 12 * * *"
      timezone: "Asia/Kolkata"
      endOn: "2027-01-01T00:00:00Z"
      concurrencyPolicy: Forbid
    logLevel: INFO
    resource:
      request:
        cpu: "500m"
        memory: "512Mi"
      limit:
        cpu: "1000m"
        memory: "1Gi"

    plan:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - plan
        - --auto-apply
        - --migrate
    run:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - run
  api:
    replicas: 1
    logLevel: INFO
    resource:
      request:
        cpu: "500m"
        memory: "512Mi"
      limit:
        cpu: "2000m"
        memory: "2Gi"