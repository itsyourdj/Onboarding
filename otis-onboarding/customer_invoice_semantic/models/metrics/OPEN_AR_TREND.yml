# Source: design spec > Section 7 Metrics
# Business question: "How much total outstanding AR do we carry into each period, and is it growing?"
# Executive AR balance indicator for Finance and GM.
kind: metric
name: OPEN_AR_TREND
measure: FACTARDETAILS.OPEN_AMOUNT
ts: FACTARDETAILS.INSERTDATE
granularity: day
description: >
  Total outstanding Accounts Receivable balance tracked by load date (daily batch).
  A rising OPEN_AR_TREND alongside flat or declining COLLECTION_EFFICIENCY_TREND signals
  that AR is accumulating faster than it is being collected.
  Key Finance KPI for period-end reporting and write-off provisioning.
  Time axis: INSERTDATE (load timestamp, equivalent to business date for daily batches).
