# Source: design spec > Section 7 Metrics
# Business question: "Is our collection efficiency improving or deteriorating period-over-period?"
# Primary AR health KPI for Collections Manager and GM.
kind: metric
name: COLLECTION_EFFICIENCY_TREND
measure: FACTARCOLLECTION.COLLECTION_EFFICIENCY
ts: FACTARCOLLECTION.INSERTDATE
granularity: day
description: >
  Cash-application efficiency at customer × period × LOB grain.
  Formula: SUM(CASHAPPLIED) / SUM(TOTALRECEIPTS).
  For executive portfolio CEI by collection priority, use CEI_TREND (FactDSO.CEI) instead.
  Target: >= 0.85. Time axis: INSERTDATE (daily batch load timestamp).
