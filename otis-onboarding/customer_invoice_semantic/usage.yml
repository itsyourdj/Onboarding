good_for:
  - title: Days Sales Outstanding (DSO) and DSO vs payment terms
    details: >
      How long it takes to collect cash. Native DSO from FactDSO; compare to contractual
      terms via DSOVarianceFromTerms. Future analysis by invoice amount band.

  - title: Disputed amount rolling trends and recovery
    details: >
      Rolling 30/60/90/180-day disputed exposure and dispute recovery ratio —
      how much of disputed balance Otis is (un)likely to collect after resolution.

  - title: Collection prioritization effectiveness
    details: >
      DSO and CEI by collection-prioritized (H/M/L) vs not-prioritized (NONE) segments.

  - title: Collection leakage detection
    details: >
      Unapplied cash, reserve inaccuracy, overdue without action, credit hold exposure,
      and other leakage signals on invoice/receipt grain.

  - title: Reserve vs forecast accuracy, payment term compliance, executive AR dashboards
    details: >
      Finance period-end provisioning, compliance (AgingDays vs NetDays), and GM roll-ups.

  - title: AI natural-language AR queries (Cortex Analyst)
    details: >
      Six semantic models with synonyms, instructions, and example SQL.

not_for:
  - Real-time alerting — daily JDE pipeline refresh only
  - Rebuilding RL_JDE gold tables (owned by JDE/data engineering)
  - Sub-invoice-line detail — grain is invoice / pay-item
  - F4211 sales-order-based DSO — current denominator is invoiced gross (RPAAP)
  - Multi-currency USD normalisation — local currency only
  - Invoice-level reserve-forecast DQ enforcement

caveats:
  - title: "Is it a right fit for me?" 
    details: >
      Stakeholder Collections/Finance language for Studio good_for/not_for will be
      finalized tomorrow. Structure above is ready to receive that copy.
    severity: low

  - title: DSO denominator uses invoiced gross, not book sales
    details: >
      TotalGrossInvoiced (RPAAP) substitutes for Total Sales until F4211 is integrated.
      Acceptable for Otis service/maintenance AR.
    severity: medium

  - title: Two CEI metrics — different grains, not duplicates
    details: >
      CEI_TREND (FactDSO) = executive portfolio CEI by collection priority.
      COLLECTION_EFFICIENCY_TREND (FactARCollection) = cash application at receipt grain.
      portfolio_cei_anomaly DQ runs on FactDSO only.
    severity: low

  - title: DisputeRecoveryRatio framing
    details: >
      Gold layer stores recovered proportion. Remaining obligation = 1 - ratio.
      Confirm Finance wording before executive reporting.
    severity: medium

  - title: Estimated DQ thresholds require calibration post-deployment
    details: >
      Collector tiers (30/60/90), unapplied cash >20%, reserve change >20%, etc.
      Replace with data-driven thresholds after 30-day baseline.
    severity: high

