# Source: design spec > Section 7 Metrics
# Business question: "Is collection prioritization working?" — DSO by prioritized vs not.
kind: metric
name: DSO_BY_COLLECTION_PRIORITY
measure: FACTDSO.AVG_DSO
ts: FACTDSO.INSERTDATE
granularity: month
description: >
  Days Sales Outstanding segmented by CollectionPriority (H/M/L vs NONE).
  Compare collection_prioritized vs not_prioritized segments on FactDSO.
  Lower DSO on prioritized segments indicates prioritization is effective.
