- name: JDE_PRODUCTION.STAGING.F03B11
  description: INVOICE HEADER SOURCE.
  columns:
    RPCO: VARCHAR
    RPDOC: DECIMAL(38,0)
    RPDCT: VARCHAR
    RPSFX: VARCHAR
    RPKCO: VARCHAR
    RPAN8: DECIMAL(38,0)
    RPSBL: VARCHAR
    RPAG: DECIMAL(18,2)
    RPAAP: DECIMAL(18,2)
    RPSTAM: DECIMAL(18,2)
    RPADSC: VARCHAR
    RPDPAM: DECIMAL(18,2)
    RPDPDT: DECIMAL(38,0)
    RPDGJ: DECIMAL(38,0)
    RPDDJ: DECIMAL(38,0)
    RPIVD: DECIMAL(38,0)
    RPCRCD: VARCHAR
    RPASTS: VARCHAR
    RPMCU: VARCHAR
    RPPTC: VARCHAR
    RPAID: VARCHAR
    RPRMK: VARCHAR
    RPUSER: VARCHAR
    RPUPMJ: DECIMAL(38,0)
    RPCRR: DECIMAL(18,7)
  column_descriptions:
    RPCO: JDE company identifier; part of invoice grain key.
    RPDOC: JDE document number; part of invoice grain key.
    RPDCT: JDE document type code (e.g. RI, RM); part of invoice grain key.
    RPSFX: Pay item suffix; part of invoice grain key.
    RPKCO: Document company identifier; part of invoice grain key.
    RPAN8: JDE customer address number (customer identifier).
    RPSBL: Subledger type code for the invoice line.
    RPAG: Open amount (outstanding balance) on the invoice pay-item.
    RPAAP: Gross amount (original invoiced amount before adjustments).
    RPSTAM: Tax amount on the invoice.
    RPADSC: Dispute reason code; co-populates with dispute status when under dispute.
    RPDPAM: Disputed amount (explicit dispute dollars from JDE).
    RPDPDT: Dispute date in JDE Julian format; anchor for FactDSO rolling windows.
    RPDGJ: GL posting date in JDE Julian format.
    RPDDJ: Payment due date in JDE Julian format.
    RPIVD: Invoice date in JDE Julian format.
    RPCRCD: Transaction currency code (USD, EUR, etc.).
    RPASTS: Payment status (P=Paid, A=Open, D=Disputed, H=Hold).
    RPMCU: Business unit code from JDE.
    RPPTC: Payment term code; join key to F0014 payment terms.
    RPAID: GL offset account code; used to derive LOB via F0012.
    RPRMK: Remark / dispute description text on the invoice.
    RPUSER: JDE user id that last updated the invoice record.
    RPUPMJ: Julian date of last update to the invoice record.
    RPCRR: Exchange rate at time of posting.
  column_tags:
    RPCO: ['IDENTIFIER', 'JOIN_KEY']
    RPDOC: ['IDENTIFIER', 'DOCUMENT']
    RPAN8: ['IDENTIFIER', 'CUSTOMER']
    RPAG: ['MEASURE', 'FINANCIAL']
    RPAAP: ['MEASURE', 'FINANCIAL']
    RPAID: ['DIMENSION', 'LOB_KEY']
    RPPTC: ['DIMENSION', 'TERM_KEY']

- name: JDE_PRODUCTION.STAGING.F59HQ084
  description: RESERVE / FORECAST SOURCE.
  columns:
    HQCO: VARCHAR
    HQDOC: DECIMAL(38,0)
    HQDCT: VARCHAR
    HQSFX: VARCHAR
    HQAN8: DECIMAL(38,0)
    HQCRSV: DECIMAL(18,2)
    HQARSV: DECIMAL(18,2)
    HQPRSV: DECIMAL(18,2)
    HQFR30: DECIMAL(18,2)
    HQFR60: DECIMAL(18,2)
    HQFR90: DECIMAL(18,2)
    HQCHRV: DECIMAL(18,2)
    HQDFTO: DECIMAL(18,2)
    HQADJA: DECIMAL(18,2)
    HQRSCA: DECIMAL(18,2)
    HQAGDY: DECIMAL(38,0)
    HQRP: DECIMAL(38,0)
    HQAOFD: DECIMAL(38,0)
    HQLRDT: DECIMAL(38,0)
    HQUSER: VARCHAR
  column_descriptions:
    HQCO: JDE company identifier; join key to invoice header.
    HQDOC: Document number; join key to invoice header.
    HQDCT: Document type; join key to invoice header.
    HQSFX: Pay item suffix; join key to invoice header.
    HQAN8: Customer address number on the reserve record.
    HQCRSV: Current doubtful debt reserve amount for the invoice.
    HQARSV: AR-specific current reserve calculation.
    HQPRSV: Previous period forecast reserve (for variance analysis).
    HQFR30: 30-day forward reserve forecast.
    HQFR60: 60-day forward reserve forecast.
    HQFR90: 90-day forward reserve forecast.
    HQCHRV: Period-over-period change in reserve (leakage signal L2/L7).
    HQDFTO: Draft open amount on provisional invoices.
    HQADJA: Manual reserve adjustment amount.
    HQRSCA: Reserve cash applied against the invoice (leakage signal L6).
    HQAGDY: Aging days computed by JDE reserve process.
    HQRP: Fiscal period integer key for the reserve snapshot.
    HQAOFD: As-of Julian date used for aging calculation.
    HQLRDT: Latest receipt Julian date applied to the invoice.
    HQUSER: JDE user id that last updated the reserve record.
  column_tags:
    HQCRSV: ['MEASURE', 'RESERVE']
    HQFR30: ['MEASURE', 'FORECAST']
    HQCHRV: ['MEASURE', 'DELTA']
    HQRP: ['TIME_DIMENSION', 'PERIOD']

