# Source: design spec > Section 13.1 External Model Definitions
# All 5 tables exist in Snowflake under the RL_JDE schema — managed by the JDE pipeline.
# Vulcan registers these as EXTERNAL metadata stubs. No transformation is applied.
#
# NOTE: Database references use JDE_PRODUCTION from config.yaml.

# ─────────────────────────────────────────────────────────────────────────────
# 1. DIMARDETAILS — Invoice Dimension Table
#    Grain: COMPANYID + DOCUMENTCOMPANY + DOCNO + DOCTYPE + PAYITM
# ─────────────────────────────────────────────────────────────────────────────
- name: JDE_PRODUCTION.RL_JDE.DIMARDETAILS
  description: >
    Invoice Dimension Table — the descriptive backbone of Customer Invoices Analysis.
    One row per invoice / pay-item. Carries all attributes: collector ownership,
    dispute status, LOB, credit hold flag, and latest collection comments.
    Source: JDE ERP pipeline (F03B11, F0101, F03012, F5803B2I/C, F0006, Workday).
  grains:
    - COMPANYID
    - DOCUMENTCOMPANY
    - DOCNO
    - DOCTYPE
    - PAYITM
  audits:
    - name: ar_fact_dim_grain_integrity
    - name: ar_dispute_co_population_integrity
    - name: ar_payment_term_orphan
  columns:
    COMPANYID:           VARCHAR(10)
    DOCUMENTCOMPANY:     VARCHAR(10)
    DOCNO:               VARCHAR(20)
    DOCTYPE:             VARCHAR(5)
    PAYITM:              VARCHAR(5)
    CUSTOMERNUMBER:      VARCHAR(20)
    PARENTCUSTOMER:      VARCHAR(20)
    SALESREP:            VARCHAR(50)
    COLLECTOR:           VARCHAR(50)
    COLLECTIONMANAGER:   VARCHAR(50)
    GLOFFSET:            VARCHAR(10)
    LOB:                 VARCHAR(50)
    BUSINESSUNIT:        VARCHAR(10)
    BUDESC:              VARCHAR(100)
    PAYMENTTERMCODE:     VARCHAR(10)
    DISPUTEREASONCODE:   VARCHAR(10)
    DISPUTESTATUS:       VARCHAR(20)
    DISPUTECODEDESC:     VARCHAR(100)
    RESOLVERCODE:        VARCHAR(10)
    RESOLVERNAME:        VARCHAR(100)
    INVOICEDATE:         DATE
    DUEDATE:             DATE
    PROMISETOPAY:        DATE
    ATTACHMENTSTARTDATE: DATE
    ATTACHMENTENDDATE:   DATE
    CURRENCYCODE:        VARCHAR(5)
    HOLDFLAG:            VARCHAR(1)
    WORKDAYEMAIL:        VARCHAR(200)
    CHARGEBACKCODE:      VARCHAR(20)
    LASTINVOICECOMMENT:  VARCHAR(4000)
    LASTCUSTOMERCOMMENT: VARCHAR(4000)
    INSERTDATE:          TIMESTAMP_NTZ
    MODIFYDATE:          TIMESTAMP_NTZ
  column_descriptions:
    COMPANYID: "JDE company identifier; part of invoice grain key."
    DOCUMENTCOMPANY: "Document company identifier; part of invoice grain key."
    DOCNO: "JDE document number; part of invoice grain key."
    DOCTYPE: "JDE document type; part of invoice grain key."
    PAYITM: "Pay item suffix; part of invoice grain key."
    CUSTOMERNUMBER: "JDE customer number used for customer-level AR analysis."
    COLLECTOR: "COLLECTOR responsible for recovery follow-up; owner field for collection operations."
    LOB: "Line of Business derived via GLOFFSET mapping; key for LOB-level KPI reporting."
    PAYMENTTERMCODE: "Payment term code used to join ARPAYMENTTERM for compliance checks."
    DISPUTESTATUS: "Current dispute state (Open/Resolved/null)."
    DISPUTEREASONCODE: "Dispute reason code; must co-populate with DISPUTESTATUS."
    HOLDFLAG: "Credit hold flag (Y/N); used in leakage signal L8."
    DUEDATE: "Contractual due date used with AGINGDAYS for overdue and compliance checks."
    PROMISETOPAY: "Customer promised payment date tracked by collections team."
    WORKDAYEMAIL: "COLLECTOR or sales rep work email used for action triggers."
    MODIFYDATE: "Last modification timestamp used for freshness monitoring."
  column_tags:
    COMPANYID: ["grain", "identifier", "join_key"]
    DOCUMENTCOMPANY: ["grain", "identifier"]
    DOCNO: ["grain", "identifier", "invoice_key"]
    DOCTYPE: ["grain", "identifier"]
    PAYITM: ["grain", "identifier"]
    CUSTOMERNUMBER: ["dimension", "customer", "join_key", "kpi"]
    COLLECTOR: ["dimension", "ownership", "kpi", "action_trigger"]
    LOB: ["dimension", "lob", "kpi", "dashboard"]
    PAYMENTTERMCODE: ["dimension", "compliance", "join_key"]
    DISPUTESTATUS: ["dimension", "dispute", "kpi"]
    DISPUTEREASONCODE: ["dimension", "dispute", "kpi"]
    HOLDFLAG: ["flag", "leakage", "kpi", "action_trigger"]
    DUEDATE: ["date", "compliance", "aging", "kpi"]
    PROMISETOPAY: ["date", "collections", "action_trigger"]
    WORKDAYEMAIL: ["contact", "action_trigger"]
    MODIFYDATE: ["audit", "freshness"]

# ─────────────────────────────────────────────────────────────────────────────
# 2. FACTARDETAILS — Invoice Measures Table
#    Grain: COMPANYID + DOCUMENTCOMPANY + DOCNO + DOCTYPE + PAYITM
# ─────────────────────────────────────────────────────────────────────────────
- name: JDE_PRODUCTION.RL_JDE.FACTARDETAILS
  description: >
    Invoice Measures Table — all quantitative AR KPIs per invoice / pay-item.
    Open amounts, doubtful debt reserves, 30/60/90-day forecasts, aging days,
    and reserve cash applied. The financial heart of Customer Invoices Analysis.
    Source: JDE ERP pipeline (F03B11, F59HQ084).
  grains:
    - COMPANYID
    - DOCUMENTCOMPANY
    - DOCNO
    - DOCTYPE
    - PAYITM
  audits:
    - name: ar_fact_dim_grain_integrity
    - name: ar_payment_term_orphan
  columns:
    COMPANYID:               VARCHAR(10)
    DOCUMENTCOMPANY:         VARCHAR(10)
    DOCNO:                   VARCHAR(20)
    DOCTYPE:                 VARCHAR(5)
    PAYITM:                  VARCHAR(5)
    OPENAMOUNT:              DECIMAL(18, 2)
    GROSSAMOUNT:             DECIMAL(18, 2)
    TAXAMOUNT:               DECIMAL(18, 2)
    DISPUTEDAMOUNT:          DECIMAL(18, 2)
    CURRENTRESERVE:          DECIMAL(18, 2)
    ARCURRENTRESERVE:        DECIMAL(18, 2)
    PREVIOUSFORECASTRESERVE: DECIMAL(18, 2)
    FORECASTRESERVE30:       DECIMAL(18, 2)
    FORECASTRESERVE60:       DECIMAL(18, 2)
    FORECASTRESERVE90:       DECIMAL(18, 2)
    CHANGEINRESERVE:         DECIMAL(18, 2)
    DRAFTOPENAMOUNT:         DECIMAL(18, 2)
    ADJUSTMENTAMOUNT:        DECIMAL(18, 2)
    RESERVECASHAPPLIED:      DECIMAL(18, 2)
    AGINGDAYS:               INTEGER
    FISCALPERIODID:          INTEGER
    GLDATE:                  DATE
    DUEDATE:                 DATE
    AGEASOFDATE:             DATE
    LATESTRECEIPTDATE:       DATE
    INSERTDATE:              TIMESTAMP_NTZ
  column_descriptions:
    COMPANYID: "JDE company identifier; part of invoice grain key."
    DOCUMENTCOMPANY: "Document company identifier; part of invoice grain key."
    DOCNO: "JDE document number; part of invoice grain key."
    DOCTYPE: "JDE document type; part of invoice grain key."
    PAYITM: "Pay item suffix; part of invoice grain key."
    OPENAMOUNT: "Outstanding invoice balance; primary AR exposure metric."
    GROSSAMOUNT: "Original invoice amount before adjustments."
    DISPUTEDAMOUNT: "Amount currently under dispute."
    CURRENTRESERVE: "Current doubtful debt reserve balance."
    FORECASTRESERVE30: "30-day reserve forecast used in reserve accuracy and leakage checks."
    FORECASTRESERVE60: "60-day reserve forecast."
    FORECASTRESERVE90: "90-day reserve forecast."
    CHANGEINRESERVE: "Period-over-period reserve movement; leakage signal L2/L7."
    RESERVECASHAPPLIED: "Reserve cash applied to invoices; leakage signal L6 when zero on aged invoices."
    AGINGDAYS: "Days outstanding beyond due date; >30 marks overdue."
    FISCALPERIODID: "Fiscal period integer key ((Century*100+Year)*100+Month)."
    AGEASOFDATE: "As-of date used for aging calculation."
    INSERTDATE: "Load timestamp used for trend metric time axis."
  column_tags:
    COMPANYID: ["grain", "identifier", "join_key"]
    DOCUMENTCOMPANY: ["grain", "identifier"]
    DOCNO: ["grain", "identifier", "invoice_key"]
    DOCTYPE: ["grain", "identifier"]
    PAYITM: ["grain", "identifier"]
    OPENAMOUNT: ["measure", "amount", "kpi", "finance"]
    GROSSAMOUNT: ["measure", "amount", "finance"]
    DISPUTEDAMOUNT: ["measure", "amount", "dispute", "leakage"]
    CURRENTRESERVE: ["measure", "reserve", "stock", "kpi", "finance"]
    FORECASTRESERVE30: ["measure", "reserve", "forecast", "kpi", "finance"]
    FORECASTRESERVE60: ["measure", "reserve", "forecast", "finance"]
    FORECASTRESERVE90: ["measure", "reserve", "forecast", "finance"]
    CHANGEINRESERVE: ["measure", "reserve", "leakage", "signal"]
    RESERVECASHAPPLIED: ["measure", "reserve", "leakage", "signal"]
    AGINGDAYS: ["measure", "aging", "kpi", "overdue", "compliance"]
    FISCALPERIODID: ["time_dimension", "period", "kpi"]
    AGEASOFDATE: ["date", "time_dimension", "aging"]
    INSERTDATE: ["audit", "freshness", "time_dimension"]

# ─────────────────────────────────────────────────────────────────────────────
# 3. FACTARCOLLECTION — Collection Facts Table
#    Grain: COMPANYID + CUSTOMERNUMBER + FISCALPERIODID + LOB
# ─────────────────────────────────────────────────────────────────────────────
- name: JDE_PRODUCTION.RL_JDE.FACTARCOLLECTION
  description: >
    Collection Facts Table — aggregated collection performance per customer,
    LOB, and fiscal period. Home of the Collection Efficiency Index (CEI),
    unapplied cash, and receipt volume KPIs.
    Source: JDE ERP pipeline (F03B14, F03B13, F0006).
  grains:
    - COMPANYID
    - CUSTOMERNUMBER
    - FISCALPERIODID
    - LOB
  audits:
    - name: ar_cash_applied_exceeds_receipts
  columns:
    COMPANYID:            VARCHAR(10)
    CUSTOMERNUMBER:       VARCHAR(20)
    FISCALPERIODID:       INTEGER
    LOB:                  VARCHAR(50)
    BUSINESSUNIT:         VARCHAR(10)
    PAYMENTTERMCODE:      VARCHAR(10)
    TOTALRECEIPTS:        DECIMAL(18, 2)
    CASHAPPLIED:          DECIMAL(18, 2)
    RESERVECASH:          DECIMAL(18, 2)
    ADJUSTEDCOLLECTION:   DECIMAL(18, 2)
    COLLECTIONEFFICIENCY: DECIMAL(10, 6)
    INSERTDATE:           TIMESTAMP_NTZ
  column_descriptions:
    COMPANYID: "JDE company identifier; part of collection grain key."
    CUSTOMERNUMBER: "Customer identifier; part of collection grain key."
    FISCALPERIODID: "Fiscal period key used for trend analysis."
    LOB: "Line of Business key for LOB-level CEI reporting."
    PAYMENTTERMCODE: "Payment term code for compliance context joins."
    TOTALRECEIPTS: "Total cash received in the customer-period-LOB bucket."
    CASHAPPLIED: "Cash successfully applied to open invoices (CEI numerator)."
    RESERVECASH: "Reserve cash component within receipts."
    ADJUSTEDCOLLECTION: "Collection amount after adjustments; leakage signal L3."
    COLLECTIONEFFICIENCY: "Stored CEI ratio from source; should be in business-valid range."
    INSERTDATE: "Load timestamp used for trend metric time axis."
  column_tags:
    COMPANYID: ["grain", "identifier", "join_key"]
    CUSTOMERNUMBER: ["grain", "customer", "identifier", "join_key"]
    FISCALPERIODID: ["grain", "time_dimension", "period", "kpi"]
    LOB: ["grain", "dimension", "lob", "kpi"]
    PAYMENTTERMCODE: ["dimension", "compliance", "join_key"]
    TOTALRECEIPTS: ["measure", "amount", "receipts", "kpi"]
    CASHAPPLIED: ["measure", "amount", "receipts", "kpi", "cei"]
    RESERVECASH: ["measure", "amount", "reserve"]
    ADJUSTEDCOLLECTION: ["measure", "amount", "leakage", "signal"]
    COLLECTIONEFFICIENCY: ["measure", "kpi", "cei", "dashboard", "stored_ratio"]
    INSERTDATE: ["audit", "freshness", "time_dimension"]

# ─────────────────────────────────────────────────────────────────────────────
# 4. DIMARCOLLECTIONLOB — Line of Business Reference Dimension
#    Grain: LOBKEY
# ─────────────────────────────────────────────────────────────────────────────
- name: JDE_PRODUCTION.RL_JDE.DIMARCOLLECTIONLOB
  description: >
    Line of Business Reference Dimension — maps GL Offset codes to LOB labels.
    One row per LOBKEY. Used to classify invoices and collection records
    by business line across all fact tables.
    Source: JDE ERP pipeline (F0012 GL Offset descriptions).
  grains:
    - LOBKEY
  audits: []
  columns:
    LOBKEY:         INTEGER
    COMPANYID:      VARCHAR(10)
    LOBCODE:        VARCHAR(20)
    LOBDESCRIPTION: VARCHAR(100)
    GLOFFSET:       VARCHAR(10)
  column_descriptions:
    LOBKEY: "Surrogate key for LOB reference records."
    COMPANYID: "Company identifier associated with LOB mapping."
    LOBCODE: "LOB code used by fact and dimension tables."
    LOBDESCRIPTION: "Human-readable line of business label."
    GLOFFSET: "GL offset code used to derive LOB in invoice data."
  column_tags:
    LOBKEY: ["grain", "surrogate_key"]
    COMPANYID: ["identifier"]
    LOBCODE: ["dimension", "lob", "join_key", "kpi"]
    LOBDESCRIPTION: ["dimension", "lob", "display"]
    GLOFFSET: ["dimension", "lob", "join_key"]

# ─────────────────────────────────────────────────────────────────────────────
# 5. ARPAYMENTTERM — Payment Term Reference Dimension
#    Grain: PAYMENTTERMKEY
# ─────────────────────────────────────────────────────────────────────────────
- name: JDE_PRODUCTION.RL_JDE.ARPAYMENTTERM
  description: >
    Payment Term Reference Dimension — defines payment terms used across invoices.
    One row per PAYMENTTERMKEY. NETDAYS drives payment term compliance analysis
    (AGINGDAYS > NETDAYS = invoice has breached its agreed payment term).
    Source: JDE ERP pipeline (F0014 Payment Terms).
  grains:
    - PAYMENTTERMKEY
  audits: []
  columns:
    PAYMENTTERMKEY:  INTEGER
    COMPANYID:       VARCHAR(10)
    PAYMENTTERMCODE: VARCHAR(10)
    DESCRIPTION:     VARCHAR(100)
    NETDAYS:         INTEGER
  column_descriptions:
    PAYMENTTERMKEY: "Surrogate key for payment term records."
    COMPANYID: "Company identifier associated with payment term mapping."
    PAYMENTTERMCODE: "Payment term code used by invoice and collection records."
    DESCRIPTION: "Human-readable payment term text (e.g., Net 30)."
    NETDAYS: "Allowed payment window in days; used for compliance checks."
  column_tags:
    PAYMENTTERMKEY: ["grain", "surrogate_key"]
    COMPANYID: ["identifier"]
    PAYMENTTERMCODE: ["dimension", "compliance", "join_key"]
    DESCRIPTION: ["dimension", "compliance", "display"]
    NETDAYS: ["measure", "compliance", "threshold"]
