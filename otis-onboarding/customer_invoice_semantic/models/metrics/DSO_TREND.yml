# Source: design spec > Section 7 Metrics
# Business question: "How long does it take to collect cash?"
kind: metric
name: DSO_TREND
measure: FACTDSO.AVG_DSO
ts: FACTDSO.INSERTDATE
granularity: month
description: >
  Native Days Sales Outstanding from FactDSO gold layer.
  Formula: (TotalOpenAR / TotalGrossInvoiced) * DaysInPeriod.
  Denominator uses invoiced gross (RPAAP), not F4211 sales orders.
  Time axis: INSERTDATE (load timestamp; group with FISCALYEAR/FISCALMONTH for period context).
