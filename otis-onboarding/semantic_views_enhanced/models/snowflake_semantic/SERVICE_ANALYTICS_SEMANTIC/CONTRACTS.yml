kind: semantic
name: CONTRACTS
depends_on: MDM_NAA_PROD.MDM_OUTBOUND.GLOBAL_CONTRACT_MASTER
description: Golden service-contract master.
dimensions:
  - name: BUILDING_ID
    description: Building covered by the contract (FK to BUILDINGS).
  - name: CONTRACTSTATUS
    description: Raw contract status text from source.
    ai_context:
      instructions: Use as source lifecycle status for contract-state analysis.
      synonyms:
        - contract status
        - agreement status
  - name: CONTRACTTYPE
    description: Contract type (full-service / parts-only / ...).
    ai_context:
      instructions: Use to segment portfolio by service coverage type.
      synonyms:
        - service contract type
        - coverage type
  - name: CONTRACT_ID
    description: Surrogate service-contract key.
    behavior:
      type: identifier
    ai_context:
      instructions: Primary key for contract-level analysis and joins.
      synonyms:
        - contract
        - agreement id
  - name: CUSTOMER_ID
    description: Customer holding the contract (FK to CUSTOMERS).
    ai_context:
      instructions: Use for customer portfolio and revenue concentration views.
      synonyms:
        - customer
        - account
  - name: GBO
    description: Global business organization / branch grouping.
  - name: ISACTIVE
    description: Boolean active flag derived from contract status.
    ai_context:
      instructions: Preferred filter for active contract population.
      caveats:
        - Derived flag may lag raw status transitions.
      synonyms:
        - active contract flag
        - live contract
  - name: SERVICETYPE
    description: Service level/type on the contract.
    ai_context:
      instructions: Use to compare commitments and pricing by service level.
      synonyms:
        - service level
        - maintenance type
  - name: CONTRACTVALUE
    description: Total contract value in billing currency.
    ai_context:
      instructions: Use as principal commercial value field.
      caveats:
        - Billing currency can differ across records.
      synonyms:
        - contract value
        - agreement value
  - name: GROSSMONTHLYBILLING
    description: Gross monthly billing amount.
    ai_context:
      instructions: Use for pre-adjustment recurring billing analysis.
      synonyms:
        - gross monthly billing
        - billed before adjustments
  - name: NETMONTHLYBILLING
    description: Net monthly billing amount after adjustments.
    ai_context:
      instructions: Use for realized recurring billing after adjustments.
      synonyms:
        - net monthly billing
        - adjusted monthly billing
  - name: CONTRACTTYPEDESCRIPTION
    description: "Plain-language contract type description (added 2026-07-29)."
    ai_context:
      instructions: Use for customer-facing display of contract type instead of the raw CONTRACTTYPE code.
      synonyms:
        - contract type description
  - name: CONTRACTSTATUSDESCRIPTION
    description: "Plain-language contract status description (added 2026-07-29)."
    ai_context:
      instructions: Use for customer-facing display of contract status instead of the raw CONTRACTSTATUS code.
      synonyms:
        - contract status description
  - name: SERVICEPACKAGEDESC
    description: "Service package name/description on the contract (added 2026-07-29)."
    ai_context:
      instructions: Use for customer-facing display of the contracted service tier.
      synonyms:
        - service package
        - service tier
  - name: CONTRACTSTARTDATE
    description: "Date the contract started (added 2026-07-29)."
    ai_context:
      instructions: Use for contract-tenure and cohort analysis.
      synonyms:
        - start date
        - contract inception date
  - name: ORIGINALCONTRACTEXPDATE
    description: "Original contract expiration date (added 2026-07-29)."
    ai_context:
      instructions: Use to assess original committed term length.
      synonyms:
        - expiration date
        - contract expiry
  - name: RENEWALDATE
    description: "Next/most recent renewal date on the contract (added 2026-07-29)."
    ai_context:
      instructions: Use to identify upcoming renewals for retention outreach.
      synonyms:
        - renewal date
        - next renewal
  - name: CANCELDATE
    description: "Date the contract was cancelled, if applicable (added 2026-07-29)."
    ai_context:
      instructions: Use with CANCELLATIONREASON to analyze churn timing.
      synonyms:
        - cancellation date
        - churn date
  - name: CANCELLATIONREASON
    description: "Reason the contract was cancelled, if applicable (added 2026-07-29)."
    ai_context:
      instructions: Use for churn-reason analysis alongside CANCELDATE.
      synonyms:
        - cancel reason
        - churn reason
  - name: RENEWALFLAG
    description: "Flag indicating renewal status/intent on the contract (added 2026-07-29)."
    ai_context:
      instructions: Use as a quick renewal-risk signal alongside RENEWALDATE.
      synonyms:
        - renewal flag
  - name: SALESREPNAME
    description: "Name of the sales representative on the contract (added 2026-07-29)."
    ai_context:
      instructions: Use for sales-rep-level portfolio and renewal-outreach views.
      synonyms:
        - sales rep
        - account executive
  - name: CURRENCY_CD
    description: "Billing currency code for the contract's monetary fields (added 2026-07-29)."
    ai_context:
      instructions: Required for currency-aware comparison of CONTRACTVALUE/GROSSMONTHLYBILLING across regions.
      synonyms:
        - currency code
measures:
  - name: ACTIVE_CONTRACT_COUNT
    type: sum
    expression: CASE WHEN {CONTRACTS.ISACTIVE} THEN 1 ELSE 0 END
    description: Number of active contracts
    ai_context:
      instructions: Core KPI for active service-contract base.
      caveats:
        - Boolean-sum count; can double count if grain is not one row per contract.
      synonyms:
        - active contracts
        - live agreements
  - name: AVG_CONTRACT_VALUE
    type: avg
    expression: "{CONTRACTS.CONTRACTVALUE}"
    description: Average contract value
    ai_context:
      instructions: Use to assess average portfolio deal size.
      caveats:
        - Mean is sensitive to outliers and mixed currencies.
      synonyms:
        - average agreement value
        - mean contract value
  - name: CONTRACT_COUNT
    type: count
    expression: "{CONTRACTS.CONTRACT_ID}"
    description: Number of contracts
    ai_context:
      instructions: Baseline count of contracts in scope.
      synonyms:
        - contract volume
        - agreement count
  - name: TOTAL_CONTRACT_VALUE
    type: sum
    expression: "{CONTRACTS.CONTRACTVALUE}"
    description: Sum of contract value
    ai_context:
      instructions: Total commercial value across selected contracts.
      caveats:
        - Verify consistent currency before comparing across regions.
      synonyms:
        - total agreement value
        - book value
  - name: TOTAL_GROSS_MONTHLY_BILLING
    type: sum
    expression: "{CONTRACTS.GROSSMONTHLYBILLING}"
    description: Sum of gross monthly billing
    ai_context:
      instructions: Use for top-line monthly recurring billing.
      synonyms:
        - gross MRR
        - total gross billing
  - name: TOTAL_NET_MONTHLY_BILLING
    type: sum
    expression: "{CONTRACTS.NETMONTHLYBILLING}"
    description: Sum of net monthly billing
    ai_context:
      instructions: Use for net recurring billing performance.
      synonyms:
        - net MRR
        - total net billing
segments:
  - name: active_contracts
    expression: "{CONTRACTS.ISACTIVE} = TRUE"
    description: Contracts currently active for service delivery.
  - name: high_value_contracts
    expression: "{CONTRACTS.CONTRACTVALUE} >= 100000"
    description: Contracts with high annualized commercial value.
  - name: full_service_contracts
    expression: "UPPER({CONTRACTS.CONTRACTTYPE}) LIKE '%FULL%'"
    description: Full-service coverage contracts.
joins:
  - name: AR_OPENAR
    type: one_to_many
    on: "{CONTRACTS.CONTRACT_ID} = {AR_OPENAR.CONTRACT_ID}"
  - name: UNITS
    type: one_to_many
    on: "{CONTRACTS.CONTRACT_ID} = {UNITS.CONTRACT_ID}"
