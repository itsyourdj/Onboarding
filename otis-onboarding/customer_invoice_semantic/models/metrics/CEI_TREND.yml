# Source: design spec > Section 7 Metrics
# Business question: "What is our unified collection effectiveness by priority?"
kind: metric
name: CEI_TREND
measure: FACTDSO.UNIFIED_CEI
ts: FACTDSO.INSERTDATE
granularity: month
description: >
  Executive unified Collection Effectiveness Index from FactDSO gold layer,
  by company × fiscal period × collection priority. Time axis: INSERTDATE.
  Single source for portfolio CEI monitoring and portfolio_cei_anomaly DQ.
  For receipt-level cash application detail, use COLLECTION_EFFICIENCY_TREND on FactARCollection.
