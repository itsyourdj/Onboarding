kind: semantic
name: CALLBACKS
depends_on: SSD_NAA_PROD.RL_AMERICA.FLAT_CALLBACK_EVENT
description: Reactive service visits triggered when a unit faults or is reported not working (as opposed to planned preventive maintenance).
measures:
- name: ENTRAPMENT_CALLBACKS
  type: sum
  expression: CASE WHEN {CALLBACKS.TRAPPED_PASSENGER_FLAG} = 'Y' THEN 1 ELSE 0 END
  description: Callbacks involving a trapped passenger
  ai_context:
    instructions: Use for safety-critical callback volume tracking.
    caveats:
      - Sums a boolean flag and counts callback rows, not unique units.
    synonyms:
      - entrapments
      - trapped passenger calls
- name: FIRST_TIME_FIX_RATE_PCT
  type: number
  expression: ROUND(SUM(CASE WHEN {CALLBACKS.FTFR_FLAG} = 'Y' THEN 1 ELSE 0 END) * 100.0 / NULLIF(SUM(CASE WHEN {CALLBACKS.FTFR_FLAG} IN ('Y', 'N') THEN 1 ELSE 0 END), 0), 1)
  description: Percent of callbacks fixed on first visit
  ai_context:
    instructions: KPI for service effectiveness on reactive visits.
    caveats:
      - Excludes records where FTFR flag is missing.
      - Percentage can be distorted in low-volume slices.
    synonyms:
      - FTFR
      - first time fix
- name: OUT_OF_SERVICE_CALLBACKS
  type: sum
  expression: CASE WHEN {CALLBACKS.OUT_OF_SERVICE_FLAG} = 'Y' THEN 1 ELSE 0 END
  description: Callbacks where the unit was out of service
  ai_context:
    instructions: Use to monitor high-impact downtime callbacks.
    caveats:
      - Flag-based count; not duration of outage.
    synonyms:
      - outage callbacks
      - downtime callbacks
- name: TOTAL_CALLBACKS
  type: count
  expression: '{CALLBACKS.CALLBACKID}'
  description: Count of callback events
  ai_context:
    instructions: Primary workload measure for reactive service demand.
    synonyms:
      - callback volume
      - service call count
dimensions:
- name: CALLBACKID
  description: Unique callback event identifier.
  behavior:
    type: identifier
  ai_context:
    instructions: Use as the event-level key for callback records.
    synonyms:
      - callback id
      - service call id
- name: CALLBACK_DATE
  description: Calendar date of the callback.
  ai_context:
    instructions: Use for daily, weekly, and monthly callback trends.
    synonyms:
      - callback day
      - event date
- name: CALLBACK_TYPE
  description: Callback category/type.
- name: CONTRACT_ID
  description: Contract associated with the callback.
  ai_context:
    instructions: Use to tie callbacks to contract performance.
    synonyms:
      - contract
      - agreement id
- name: CUSTOMER_ID
  description: Customer associated with the callback.
  ai_context:
    instructions: Use for customer-level reliability analysis.
    synonyms:
      - customer
      - account
- name: FTFR_FLAG
  description: First-time-fix-resolved flag (Y/N).
  ai_context:
    instructions: Use as the success flag for first-visit resolution.
    synonyms:
      - first fix flag
      - fixed first visit
- name: GBO
  description: Global business organization / branch grouping.
- name: OUT_OF_SERVICE_FLAG
  description: Unit-out-of-service flag (Y/N).
  ai_context:
    instructions: Indicates callback impact on unit availability.
    synonyms:
      - outage flag
      - out of service indicator
- name: PRODUCTCLASS
  description: Product class of the unit at time of callback.
  ai_context:
    instructions: Use to compare callback patterns across equipment classes.
    synonyms:
      - product class
      - equipment type
- name: TCB_FLAG
  description: Trouble-callback flag (Y/N).
- name: TRAPPED_PASSENGER_FLAG
  description: Entrapment / trapped-passenger flag (Y/N).
  ai_context:
    instructions: Use to isolate passenger-entrapment safety events.
    synonyms:
      - entrapment flag
      - trapped passenger indicator
- name: UNIT_ID
  description: Unit that generated the callback (FK to UNITS).
  ai_context:
    instructions: Use for unit-level reliability and repeat-callback analysis.
    synonyms:
      - unit
      - equipment id
- name: CALLBACK_DATE_TIME
  description: Timestamp the callback was logged.
  ai_context:
    instructions: Use for intraday and response-time sequence analysis.
    synonyms:
      - callback timestamp
      - logged time
